<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Login</title>
        <link rel="stylesheet" href="https://unpkg.com/chota@latest">
        <style>
            .cl-signIn-root {
            transform: scale(1.5);
            margin-top: 20rem;
            margin-bottom: 10rem;
            }
        </style>
        <script
            async
            crossorigin="anonymous"
            data-clerk-publishable-key="pk_test_aGVhbHRoeS1wZWdhc3VzLTUzLmNsZXJrLmFjY291bnRzLmRldiQ"
            src="https://healthy-pegasus-53.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
            type="text/javascript">
        </script>
    </head>
    <body>
        <div class="container">
            <section>
                <div class="row sign-in">
                    <div class="col is-center">
                    <div id="sign-in"></div>
                    </div>
                </div>
            </section>
        </div>
        <script>
            window.addEventListener('load', async function () {
                await Clerk.load();
                Clerk.mountSignIn(document.getElementById('sign-in'));
                Clerk.addListener(({ user }) => {
                if (user) {
                    window.location.href = "/index.html";
                }
                });
            });
        </script>
    </body>
</html>
